name: Hourly Firebase Backup

on:
  schedule:
    - cron: '0 * * * *'   # top of every hour, UTC
  workflow_dispatch:      # manual trigger button in GitHub UI

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install firebase-admin
        run: npm install --no-save firebase-admin@12

      - name: Create backup
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/backup.js

      - name: Commit and push backup
        run: |
          git config user.name "Backup Bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add backups/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Hourly backup $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
